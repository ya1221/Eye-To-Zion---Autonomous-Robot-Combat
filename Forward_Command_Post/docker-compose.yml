services:
  overhead_tracker:
    build: ./overhead
    container_name: overhead_tracker
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - CNT_TEAM=2
      - QT_LOGGING_RULES=qt.qpa.fonts.warning=false
    volumes:
      - ./overhead:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
    group_add:
      - video
    device_cgroup_rules:
      - 'c 81:* rmw'
    restart: always

  zenoh_bridge:
    image: eclipse/zenoh-bridge-ros2dds:latest
    container_name: zenoh_bridge
    network_mode: host
    restart: always
    environment:
      - ROS_DISTRO=humble
    command: ["-l", "tcp/0.0.0.0:7447"]

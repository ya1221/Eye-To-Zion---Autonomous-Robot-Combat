version: '3.8'

services:
  # 1. עיבוד התמונה ושידור ה-ROS 2 המרכזי
  overhead_tracker:
    build: .
    container_name: overhead_tracker
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
    group_add:
      - video
    device_cgroup_rules:
      - 'c 81:* rmw'
    restart: always

  # 2. הגשר שמאזין ל-ROS 2 ומנתב ל-Zenoh על גבי Tailscale
  zenoh_bridge:
    image: eclipse/zenoh-bridge-ros2dds:latest
    container_name: zenoh_bridge
    network_mode: host
    restart: always
    environment:
      - ROS_DISTRO=humble
    command: ["-l", "tcp/0.0.0.0:7447"]

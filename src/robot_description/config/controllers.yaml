controller_manager:
  ros__parameters:
    update_rate: 20
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    publish_rate: 50
    use_stamped_vel: true
    front_steering: true 
    front_wheels_names: [front_left_steering_joint, front_right_steering_joint]
    rear_wheels_names:  [front_left_wheel_joint, front_right_wheel_joint]        

    wheelbase: 0.245
    front_wheel_track: 0.23
    rear_wheel_track:  0.08
    front_wheels_radius: 0.04
    rear_wheels_radius:  0.05
    
    publish_odom: true
    publish_tf: false
  # Try open_loop=true to bypass closed-loop corrections from the controller.
  # This helps isolate whether the controller's feedback/odom path is causing
  # asymmetric wheel commands at higher speeds.
    open_loop: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: true
    twist_covariance_diagonal: [0.001, 7.0, 14.0, 21.0, 28.0, 35.0]
    pose_covariance_diagonal:  [0.001, 7.0, 14.0, 21.0, 28.0, 35.0]

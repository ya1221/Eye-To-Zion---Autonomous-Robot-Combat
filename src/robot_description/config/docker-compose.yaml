version: '3.8'

services:
  influxdb:
    image: influxdb:3-core
    container_name: influxdb3-core
    ports:
      - "8086:8181" 
    command: 
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
    volumes:
      - ./influx3_data:/var/lib/influxdb3/data

  influxdb-ui:
    image: influxdata/influxdb3-ui
    container_name: influxdb3-ui
    ports:
      - "8888:80" 
    depends_on:
      - influxdb
  
  nginx:
    image: nginx:alpine
    container_name: robot-image-server
    ports:
      - "8080:80"
    volumes:
    - /home/itay3711/AutonomousWarfare/src/robot_description/config/shared_images:/usr/share/nginx/html:ro
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=roboticsorg-robot-panel
      - GF_DEFAULT_APP_MODE=development
    volumes:
      - grafana-storage:/var/lib/grafana
      - ../roboticsorg-robot-panel/dist:/var/lib/grafana/plugins/roboticsorg-robot-panel
    depends_on:
      - nginx

volumes:
  influx3_data:
  grafana-storage:
version: '3.8'

services:
  # הקונטיינר של הרובוט/המוח (ROS2)
  tactical_brain:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: etz_brain
    # מחבר את התיקייה במחשב שלך לתוך הקונטיינר כדי שתוכל לערוך קוד מבחוץ
    volumes:
      - ./ETZ_ws:/app/ETZ_ws
    # מחבר אותו לרשת המשותפת
    networks:
      - etz_network
    # אומר לדוקר להשאיר את הקונטיינר דולק ברקע
    command: tail -F /dev/null

  # הקונטיינר של הרדיס (תקשורת)
  redis_server:
    image: redis:latest
    container_name: etz_redis
    ports:
      - "6379:6379"
    networks:
      - etz_network

networks:
  etz_network:
    driver: bridge
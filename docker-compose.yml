services:
  cv_processor:
    build: ./ai_vision/cv_processor  # Adjust path if different
    container_name: cv_processor
    network_mode: host
    ipc: host # Critical for Shared Memory access
    volumes:
      - "./ai_vision/cv_processor:/app"
    command: bash -c "source /opt/ros/humble/setup.bash && python3 cv_processor.py"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ai_inference:
    build: ./ai_vision/ai_inference
    container_name: ai_inference
    network_mode: host
    ipc: host # Critical for Shared Memory access
    cpus: '2.0' # Hard limit to prevent thermal throttling (Thermal Throttling Protection)
    environment:
      - OMP_NUM_THREADS=2
      - YOLO_OFFLINE=True # Prevent background downloads
      - YOLOV8_NO_TELEMETRY=1 # Disable data collection lags
    volumes:
      - "./ai_vision/ai_inference:/app"
    command: bash -c "source /opt/ros/humble/setup.bash && python3 ai_inference.py"
    depends_on:
      - cv_processor
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  dataset_collector:
    build: ./ai_audio/dataset_collector
    container_name: dataset_collector
    user: "1000:1000" # matches host uid/gid so recorded clips aren't root-owned
    devices:
      - "/dev/snd:/dev/snd"
    group_add:
      - audio
    volumes:
      - "./ai_audio/dataset_collector:/app"
      - "./ai_audio/dataset:/app/dataset"
    stdin_open: true
    tty: true
    profiles:
      - tools # not started by `docker compose up`; run explicitly, see below
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  preprocessing:
    build: ./ai_audio/preprocessing
    container_name: preprocessing
    user: "1000:1000"
    environment:
      - NUMBA_CACHE_DIR=/tmp/numba_cache
    volumes:
      - "./ai_audio/preprocessing:/app"
      - "./ai_audio/dataset:/app/dataset"
    profiles:
      - tools # one-off tool, run explicitly with `docker compose run`
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  training:
    build: ./ai_audio/training
    container_name: training
    user: "1000:1000"
    cpus: '4.0'
    volumes:
      - "./ai_audio/training:/app"
      - "./ai_audio/dataset:/app/dataset"
      - "./ai_audio/training/runs:/app/runs"
    profiles:
      - tools # one-off tool, run explicitly with `docker compose run`
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
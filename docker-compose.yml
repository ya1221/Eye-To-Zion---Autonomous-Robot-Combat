version: '3.8'

services:
  # ==========================================
  # 1. הקונטיינר של הרובוט (ROS 2 + Zenoh)
  # ==========================================
  robot_brain:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: etz_brain
    network_mode: "host"
    
    # --- הוסף את בלוק הסביבה הזה ---
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      
    volumes:
      - ./ETZ_ws:/app/ETZ_ws
      # --- הוסף את השורה הזו כדי לחבר את המסך ---
      - /tmp/.X11-unix:/tmp/.X11-unix:rw 
      
    command: tail -F /dev/null

  # ==========================================
  # 2. הקונטיינר של רשת ה-VPN (Tailscale)
  # ==========================================
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale
    privileged: true
    network_mode: "host"
    volumes:
      - ./ts-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      # מומלץ להעביר את המפתח לתוך קובץ .env נפרד
      - TS_AUTHKEY=tskey-auth-kDQuVvyKZA11CNTRL-e7hZfXzZzfbvewGFs7pNgbdpEQzeNxMc
      - TS_EXTRA_ARGS=--accept-dns=false
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_HOSTNAME=shay-laptop # שיניתי את השם לרובוט, כדי שיהיה ברור מול הלפטופ
      - TS_USERSPACE=false
    restart: unless-stopped
version: '3.8'

services:
  # 1. Communication Server (Central Pub/Sub Hub)
  redis_server:
    image: redis:alpine
    container_name: redis_server
    network_mode: host
    restart: always

  # 2. Vision Processor - Captures video stream and writes to shared memory
  cv_processor:
    build: ./ai_vision/cv_processor
    container_name: cv_processor
    network_mode: host
    ipc: host
    devices:
      - "/dev/video0:/dev/video0"
    volumes:
      - "./ai_vision/cv_processor:/app"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
    environment:
      - DISPLAY=${DISPLAY}
    command: bash -c "source /opt/ros/humble/setup.bash && python3 cv_processor.py"

  # 3. AI Inference Engine - Reads from shared memory, runs YOLO and tracking
  ai_inference:
    build: ./ai_vision/ai_inference
    container_name: ai_inference
    network_mode: host
    ipc: host
    volumes:
      - "./ai_vision/ai_inference:/app"
    command: bash -c "source /opt/ros/humble/setup.bash && python3 ai_inference.py"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # 4. Redis Bridge - Router between internal ROS2 and external Redis
  redis_bridge:
    build: ./ai_vision/redis_bridge
    container_name: redis_bridge
    network_mode: host
    ipc: host
    volumes:
      - "./ai_vision/redis_bridge:/app"
    command: bash -c "source /opt/ros/humble/setup.bash && python3 redis_bridge.py"

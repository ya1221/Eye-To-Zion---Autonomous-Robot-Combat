version: '3.8'

services:
  # 1. Communication Server (Central Pub/Sub Hub)
  redis_server:
    image: redis:alpine
    container_name: redis_server
    network_mode: host
    restart: always

  # 2. Vision Processor - Captures video stream and writes to shared memory
  cv_processor:
    build: .
    container_name: cv_processor
    network_mode: host
    ipc: host
    devices:
      - "/dev/video0:/dev/video0"
    volumes:
      - "./ai_vision:/app"
      - "/tmp/.X11-unix:/tmp/.X11-unix:rw"
    environment:
      - DISPLAY=${DISPLAY}
    command: bash -c "source /opt/ros/humble/setup.bash && python3 cv_processor.py"

  # 3. AI Inference Engine - Reads from shared memory, runs YOLO, and publishes to Redis
  ai_inference:
    build: .
    container_name: ai_inference
    network_mode: host
    ipc: host
    volumes:
      - "./ai_vision:/app"
    command: bash -c "source /opt/ros/humble/setup.bash && python3 ai_inference.py"

  # 4. Robot Core (ROS2) - Subscribes to Redis threats and bridges to ROS2 topics
  ros2_core:
    build: .
    container_name: ros2_core
    network_mode: host
    ipc: host
    volumes:
      - "./ai_vision:/app"
    command: bash -c "source /opt/ros/humble/setup.bash && python3 ros_core.py"

ekf_filter_node:
  ros__parameters:
    use_sim_time: True
    frequency: 50.0
    sensor_timeout: 0.5      # increased: prevents jump when rf2o drops and resumes
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true

    odom0: /odom
    odom0_config: [false, false,  false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10

    # rf2o laser odom
    odom1: /rf2o/odom
    odom1_config: [true,  true,  false,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: true   # KEY FIX: use delta pose, not absolute — prevents teleporting on bad laser scans
    odom1_relative: true       # ignore the initial pose from rf2o, start relative to EKF origin
    odom1_queue_size: 10

    imu0: /imu
    imu0_config: [false, false, false,
                  true,  true,  true,
                  false, false, false,
                  true,  true,  true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10

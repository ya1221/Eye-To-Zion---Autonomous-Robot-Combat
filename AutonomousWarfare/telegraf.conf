# ==========================================
# 1. AGENT CONFIGURATION
# ==========================================
[agent]
  interval = "5s"
  round_interval = true
  metric_buffer_limit = 10000
  debug = true
  hostname = "raspberry_pi_robot"

# ==========================================
# 2. OUTPUTS (Routing to 2 different buckets)
# ==========================================

# --- Output 1: Send ONLY ROS2 data to "sensors" bucket ---
[[outputs.influxdb_v2]]
  urls = ["http://100.64.34.51:8181"]
  token = "apiv3_rf3is-glYXXvddTlNCT8Yen711BFDx5nb0o_a68lWoLb13-q530Cs1QVIuvUBU9IfhCe43qaud8LlAKgx4hZFQ"
  organization = "Robot"
  bucket = "sensors"
  
  # CORRECTED SYNTAX: Define tagpass as a sub-section
  [outputs.influxdb_v2.tagpass]
    source = ["ros2_bridge"]

# --- Output 2: Send System Stats to "system" bucket ---
[[outputs.influxdb_v2]]
  urls = ["http://100.64.34.51:8181"]
  token = "apiv3_rf3is-glYXXvddTlNCT8Yen711BFDx5nb0o_a68lWoLb13-q530Cs1QVIuvUBU9IfhCe43qaud8LlAKgx4hZFQ"
  organization = "Robot"
  bucket = "system"
  
  # This one is a simple list, so it stays on one line
  namepass = ["cpu", "mem", "disk", "temperature", "internal_write"]

# ==========================================
# 3. INPUTS
# ==========================================

# --- ROS2 Bridge ---
[[inputs.socket_listener]]
  service_address = "unix:///tmp/sockets/telegraf.sock"
  data_format = "influx"
  [inputs.socket_listener.tags]
    source = "ros2_bridge"  

# --- System Stats ---
[[inputs.internal]]
  collect_memstats = false

[[inputs.cpu]]
  percpu = true
  totalcpu = true
[[inputs.mem]]
[[inputs.disk]]
  mount_points = ["/", "/home"]
[[inputs.temp]]
  name_override = "temperature"
[[inputs.ping]]
  ## List of urls to ping
  urls = ["100.64.34.51"]

  ## Number of pings to send per collection interval
  count = 3

  ## Time to wait between pings in seconds
  ping_interval = 1.0

  ## Timeout for each ping in seconds
  timeout = 1.0




ai_inference:
  ros__parameters:
    # ── Model ──
    # Empty = resolve from the installed share/ai_vision/models/ directory.
    # Only set an absolute path here to point at a model outside the package.
    model_path: ''
    inference_imgsz: 320
    tracker_config: bytetrack.yaml

    # ── Camera geometry ──
    hfov_degrees: 141.0
    image_width: 640.0
    image_height: 320.0
    # k1, k2, p1, p2 — mild barrel distortion, typical of a wide-angle lens.
    # Replace with cv2.calibrateCamera() output for accurate off-axis pixels.
    dist_coeffs: [-0.30, 0.08, 0.0, 0.0]

    # ── Detection tuning ──
    max_blind_time: 2.0           # seconds to keep predicting a lost target
    confidence_threshold: 0.3
    duplicate_angle_threshold: 2.0  # degrees — suppress near-duplicate detections
    lpf_alpha: 0.2                  # low-pass filter coefficient for expansion rate

    # ── Threat scoring ──
    threat_proximity_max: 50
    threat_visibility_bonus: 30
    threat_stability_high: 20
    threat_stability_med: 10
    threat_ratio_close: 0.6
    threat_vel_low: 5.0
    threat_vel_med: 15.0
    threat_score_high: 75         # score >= this → HIGH
    threat_score_med: 45          # score >= this → MEDIUM, else LOW

    # ── Diagnostics ──
    fps_warn_threshold: 7.0
    fps_log_interval: 15

    # ── Garbage collection tuning ──
    gc_gen0_interval: 150         # frames between gen-0 sweeps
    gc_full_interval: 1500        # frames between full sweeps

    # ── Topic names ──
    metadata_topic: /camera/metadata
    detections_topic: /ai/detections
    annotations_topic: /foxglove/annotations
heading_pid_controller:
  ros__parameters:
    # =====================================================
    #  YAW RATE PID (inner loop - active during turns)
    #  Compares: Nav2 commanded yaw rate vs IMU actual yaw rate
    #  Fast response, no integration drift
    # =====================================================
    kp_rate: 0.5
    ki_rate: 0.0
    kd_rate: 0.05

    # =====================================================
    #  HEADING HOLD PID (outer loop - active when straight)
    #  Compares: captured heading vs EKF actual heading
    #  Drift-free thanks to ArUco correction in EKF
    # =====================================================
    kp_heading: 1.0
    ki_heading: 0.05
    kd_heading: 0.1

    # =====================================================
    #  Controller settings
    # =====================================================
    loop_rate: 50.0            # Hz
    integral_max: 0.5          # anti-windup clamp
    straight_threshold: 0.01   # rad/s - below this, robot is "going straight"
    max_correction: 1.0        # rad/s - clamp PID output to prevent wild steering
ackermann_steering_controller:
  ros__parameters:
    use_sim_time: false
    publish_rate: 50.0
    use_stamped_vel: true
    front_steering: true

    front_wheels_names: ["front_left_steering_joint", "front_right_steering_joint"]
    rear_wheels_names:  ["front_left_wheel_joint", "front_right_wheel_joint"]

    wheelbase:           0.235
    front_wheel_track:   0.23
    rear_wheel_track:    0.08
    front_wheels_radius: 0.04
    rear_wheels_radius:  0.05

    publish_odom:  true
    publish_tf:    false
    open_loop:     true

    base_frame_id: base_footprint
    odom_frame_id: odom
    enable_odom_tf: false

    twist_covariance_diagonal: [0.001, 7.0, 14.0, 21.0, 28.0, 35.0]
    pose_covariance_diagonal:  [0.001, 7.0, 14.0, 21.0, 28.0, 35.0]

# Standalone Tailscale client - deliberately its own compose project.
#
# Kept separate from the robot stack (AutonomousWarfare/AutonomousWarfare/
# docker-compose.yml) on purpose, for two reasons:
#   1. The tailnet connection has to outlive the robot stack - a
#      `docker compose down` over there must never tear down the VPN.
#   2. Defining a tailscale service in two places races two competing
#      identities onto the same hostname.
#
# Bring it up once per machine and leave it running:
#
#   cd tailscale-client
#   cp .env.example .env     # then fill in TS_AUTHKEY and TS_HOSTNAME
#   docker compose up -d
#
# All config lives in .env (untracked). Nothing secret belongs in this file -
# an earlier revision on the rpi branch hardcoded TS_AUTHKEY here and that key
# leaked into git history and had to be revoked.
services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale

    # Covers NET_ADMIN + NET_RAW, which kernel-mode networking
    # (TS_USERSPACE=false) needs to bring up the tailscale0 interface.
    privileged: true

    # Puts the tailnet on the host's network stack, so every other container
    # using `network_mode: host` (ros2_core, zenoh_bridge, ...) reaches peers
    # without any per-container VPN setup.
    network_mode: "host"

    # TS_AUTHKEY / TS_HOSTNAME / TS_EXTRA_ARGS - see .env.example.
    env_file:
      - .env

    environment:
      # Must match the mount below; this is what makes the node identity
      # survive a restart instead of re-registering as a new device.
      - TS_STATE_DIR=/var/lib/tailscale
      # Kernel networking rather than userspace - needed for the throughput
      # the video/ROS traffic wants, and why `privileged` is set above.
      - TS_USERSPACE=false

    volumes:
      # Persists the node identity + keys across restarts. Untracked: this is
      # live per-machine state, not shareable config.
      - ./ts-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun

    restart: unless-stopped

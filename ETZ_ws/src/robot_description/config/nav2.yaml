#############################################
#              PLANNER SERVER (SMAC)
#############################################
# planner_server:
#   ros__parameters:
#     use_sim_time: True
#     expected_planner_frequency: 20.0
#     planner_plugins: ["GridBased"]

#     GridBased:
#       plugin: "nav2_smac_planner/SmacPlannerHybrid"
#       tolerance: 0.2
#       allow_unknown: true
#       max_planning_time: 3.0
#       motion_model_for_search: "REEDS_SHEPP" 
#       minimum_turning_radius: 0.3
#       reverse_penalty: 0.0
#       change_penalty: 2.0
#       non_straight_penalty: 1.3

planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid" # In Iron and older versions, "/" was used instead of "::"
      downsample_costmap: false           # whether or not to downsample the map
      downsampling_factor: 1              # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      tolerance: 0.25                     # dist-to-goal heuristic cost (distance) for valid tolerance endpoints if exact goal cannot be found.
      allow_unknown: true                 # allow traveling in unknown space
      max_iterations: 1000000             # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000    # Maximum number of iterations after within tolerances to continue to try to find exact solution
      max_planning_time: 5.0              # max time in s for planner to plan, smooth
      motion_model_for_search: "REEDS_SHEPP"    # Hybrid-A* Dubin, Redds-Shepp
      angle_quantization_bins: 72         # Number of angle bins for search
      analytic_expansion_ratio: 3.5       # The ratio to attempt analytic expansions during search for final approach.
      analytic_expansion_max_length: 3.0  # For Hybrid/Lattice nodes: The maximum length of the analytic expansion to be considered valid to prevent unsafe shortcutting
      analytic_expansion_max_cost: 200.0  # The maximum single cost for any part of an analytic expansion to contain and be valid, except when necessary on approach to goal
      analytic_expansion_max_cost_override: false  #  Whether or not to override the maximum cost setting if within critical distance to goal (ie probably required)
      minimum_turning_radius: 0.35        # minimum turning radius in m of path / vehicle
      reverse_penalty: 0.5                # Penalty to apply if motion is reversing, must be => 1
      change_penalty: 0.0                 # Penalty to apply if motion is changing directions (L to R), must be >= 0
      non_straight_penalty: 1.2           # Penalty to apply if motion is non-straight, must be => 1
      cost_penalty: 2.0                   # Penalty to apply to higher cost areas when adding into the obstacle map dynamic programming distance expansion heuristic. This drives the robot more towards the center of passages. A value between 1.3 - 3.5 is reasonable.
      retrospective_penalty: 0.015
      lookup_table_size: 20.0             # Size of the dubin/reeds-sheep distance window to cache, in meters.
      cache_obstacle_heuristic: false     # Cache the obstacle map dynamic programming distance expansion heuristic between subsequent replannings of the same goal location. Dramatically speeds up replanning performance (40x) if costmap is largely static.
      debug_visualizations: false         # For Hybrid nodes: Whether to publish expansions on the /expansions topic as an array of poses (the orientation has no meaning) and the path's footprints on the /planned_footprints topic. WARNING: heavy to compute and to display, for debug only as it degrades the performance.
      use_quadratic_cost_penalty: False
      downsample_obstacle_heuristic: True
      allow_primitive_interpolation: False
      coarse_search_resolution: 4         # Number of bins to skip when doing a coarse search for the path. Only used for all_direction goal heading mode.
      goal_heading_mode: "DEFAULT"        # DEFAULT, BIDIRECTIONAL, ALL_DIRECTION
      smooth_path: True                   # If true, does a simple and quick smoothing post-processing to the path

      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2


#############################################
#           CONTROLLER SERVER (MPPI)
#############################################
controller_server:
  ros__parameters:
    use_sim_time : True
    controller_frequency: 20.0
    # Diagnostic: log per-cycle MPPI/critic detail while debugging why
    # tactical_brain's own FollowPath goals produce zero velocity.
    verbose: true
    # Was unset, defaulting to /odom which has zero publishers (the real
    # odometry source is ackermann_steering_controller/odometry) - matches
    # the odom_topic convention already used by bt_navigator/velocity_smoother.
    odom_topic: /odometry/filtered
    # Was implicit nav2 defaults (10s/0.5m). MPPI's heading-correction
    # maneuver for tactical_brain's short paths is slow (low-speed
    # rotate+creep), consistently taking longer than the 10s default,
    # so the goal kept getting aborted as "Failed to make progress"
    # before it could finish. Diagnostic: loosened to confirm whether
    # given enough time, it actually converges.
    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 30.0
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 36
      model_dt: 0.05
      batch_size: 1000
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 1.0
      vx_min: -0.5
      vy_max: 0.0
      wz_max: 1.9
      ax_max: 3.0
      ax_min: -3.0
      ay_min: -3.0
      ay_max: 3.0
      az_max: 3.5
      iteration_count: 1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Ackermann"
      visualize: false
      reset_period: 1.0 
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: true
      AckermannConstraints:
        # 0.24 looked safe using the simple bicycle-model steering angle,
        # but ackermann_steering_controller computes separate left/right
        # angles (steering_odometry.cpp's ACKERMANN_CONFIG branch); for
        # this chassis (wheelbase=0.235, front_track=0.23) the INNER
        # wheel's angle at r=0.24 is ~1.09 rad, past the 0.819 rad joint
        # limit, so steering binds and the vehicle can't actually roll.
        # 0.4 keeps the inner wheel under ~0.69 rad, safely within limits.
        min_turning_r: 0.4
      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 15.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 1.0
        threshold_to_consider: 0.5
      # ObstaclesCritic:
      #   enabled: true
      #   cost_power: 1
      #   repulsion_weight: 1.5
      #   critical_weight: 20.0
      #   consider_footprint: false
      #   collision_cost: 10000.0
      #   collision_margin_distance: 0.1
      #   near_goal_distance: 0.5
      #   inflation_radius: 0.55 # (only in Humble)
      #   cost_scaling_factor: 10.0 # (only in Humble)
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: false
        collision_cost: 1000000.0
        near_goal_distance: 1.0
        trajectory_point_step: 2
        inflation_radius: 0.22
        cost_scaling_factor: 6.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0
      # VelocityDeadbandCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 35.0
      #   deadband_velocities: [0.05, 0.05, 0.05]
      # TwirlingCritic:
      #   enabled: true
      #   twirling_cost_power: 1
      #   twirling_cost_weight: 10.0

#############################################
#               SMOOTHER SERVER
#############################################
smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["Simple"]
    Simple:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 0.1
      w_smooth: 0.3
      w_data: 0.2
      do_refinement: false


#############################################
#               COSTMAPS
#############################################
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.05
      footprint: "[ [0.18, 0.13], [0.18, -0.13], [-0.18, -0.13], [-0.18, 0.13] ]"
      plugins: ["static_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        footprint_clearing_enabled: true
        restore_cleared_footprint: true 

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        footprint_clearing_enabled: true
        inflation_radius: 0.22  
        cost_scaling_factor: 6.0

      update_frequency: 30.0
      publish_frequency: 30.0


local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      footprint: "[ [0.18, 0.13], [0.18, -0.13], [-0.18, -0.13], [-0.18, 0.13] ]"

      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        footprint_clearing_enabled: true
        observation_sources: "scan"
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          max_obstacle_height: 2.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        footprint_clearing_enabled: true
        inflation_radius: 0.22
        cost_scaling_factor: 6.0

      update_frequency: 30.0
      publish_frequency: 30.0


#############################################
#            BEHAVIOR SERVER
#############################################
behavior_server:
  ros__parameters:
    use_sim_time: true
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      target_z: -0.30
      speed: 0.30
    wait:
      plugin: "nav2_behaviors/Wait"


#############################################
#          VELOCITY SMOOTHER
#############################################
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: "OPEN_LOOP"
    odom_topic: "/odometry/filtered"
    max_velocity: [2.0, 2.0, 3.5]
    max_accel: [2.5, 2.0, 4.0]
    max_decel: [-2.5, -2.0, -4.0]


#############################################
#         ROBOT STATE PUBLISHER
#############################################
robot_state_publisher:
  ros__parameters:
    use_sim_time: True


#############################################
#         WAYPOINT FOLLOWER
#############################################
waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200


#############################################
#       LIFECYCLE MANAGER
#############################################
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      # - slam_toolbox
      - planner_server
      - controller_server
      - behavior_server
      - smoother_server
      - bt_navigator
      # - global_costmap
      # - local_costmap
      - velocity_smoother
      - waypoint_follower

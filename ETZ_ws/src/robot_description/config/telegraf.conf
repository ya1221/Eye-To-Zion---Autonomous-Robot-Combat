# ==========================================
# 1. AGENT CONFIGURATION
# ==========================================
[agent]
  interval = "5s"
  round_interval = true
  metric_buffer_limit = 10000
  debug = true
  hostname = "raspberry_pi_robot"

# ==========================================
# 2. OUTPUTS (Routing to 2 different buckets)
# ==========================================

# --- Output 1: Send ONLY ROS2 data to "sensors" bucket ---
[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "apiv3_CL-NZqu4HRpOYR7ENJmN3kwgRXCaFpNEEC_j0QHrBqwaMf-XKoFfWWbUq9Oh83xQKEZNGNI9PO44UPPTtr6OKQ"
  organization = "Robot"
  bucket = "sensors"
  
  # CORRECTED SYNTAX: Define tagpass as a sub-section
  [outputs.influxdb_v2.tagpass]
    source = ["ros2_bridge"]

# --- Output 2: Send System Stats to "system" bucket ---
[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "apiv3_CL-NZqu4HRpOYR7ENJmN3kwgRXCaFpNEEC_j0QHrBqwaMf-XKoFfWWbUq9Oh83xQKEZNGNI9PO44UPPTtr6OKQ"
  organization = "Robot"
  bucket = "system"
  
  # This one is a simple list, so it stays on one line
  namepass = ["cpu", "mem", "disk"]

# ==========================================
# 3. INPUTS
# ==========================================

# --- ROS2 Bridge ---
[[inputs.socket_listener]]
  # service_address = "udp://127.0.0.1:8094"
  service_address = "unix:///tmp/telegraf.sock"
  data_format = "influx"
  [inputs.socket_listener.tags]
    source = "ros2_bridge"  

# --- System Stats ---
[[inputs.cpu]]
  percpu = true
  totalcpu = true
[[inputs.mem]]
[[inputs.disk]]
  mount_points = ["/", "/home"]




